# Alternative encoder: thenlper/gte-large
# All production weights unchanged; only embedding_model, names, and paths differ.
dataset_name: ONET292_GTE
checkpoint_prefix: ONET292_GTE
use_task_ids: true
output_dir: results_gte
final_output_path: output/ONET292_gte_task_to_ISCO_crosswalk.csv
onet_tasks_path: data/onet/29_2/Task Statements.xlsx
onet_tasks_dwa_path: data/onet/29_2/Tasks to DWAs.xlsx
esco_skills_path: data/esco/skills_en.csv
esco_occupation_rel_path: data/esco/occupationSkillRelations_en.csv
esco_occupations_path: data/esco/occupations_en.csv
data_version: managed-occupation-standards
onet_release: db_29_2_excel
esco_release: ESCO_en
random_seed: 42
include_soc_title: true
w_soc_title: 0.675
w_dwa: 0.030
include_esco_skills: true
isco_tasks_path: data/isco/ISCO-08 EN Structure and definitions.xlsx
embedding_model: thenlper/gte-large
normalize_embeddings: true
w_isco: 0.80
w_isco_task: 0.60
w_occ: 0.60
embedding_cache_dir: checkpoints
faiss_index_type: FlatIP
k_retrieve: 5
min_sim: 0.45
margin_best: 0.03
max_links_per_task: 1
overload_abs: 200
overload_quantile: 0.95
softmax_temperature: 0.05
lowconf_gap_threshold: 0.01
lowconf_entropy_threshold: 1.2
limit_tasks: null
